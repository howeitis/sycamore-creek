<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sonos Widget - Completing Sign In</title>
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 60px 20px; color: #333; }
    h1 { font-size: 22px; }
    p { font-size: 16px; color: #666; }
    a { color: #1a73e8; }
  </style>
</head>
<body>
  <h1>Completing Sign In...</h1>
  <p>Returning to Sonos Widget</p>
  <p style="margin-top:24px"><a id="manual" href="#">Tap here if not redirected</a></p>
  <script>
    var params = window.location.search;
    var intentUrl = 'intent://sycamorecreekconsulting.com/callback' + params + '#Intent;scheme=https;package=com.sycamorecreek.sonoswidget;end';
    document.getElementById('manual').href = intentUrl;
    window.location.href = intentUrl;
  </script>
</body>
</html>
